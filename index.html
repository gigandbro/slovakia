<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TUKE Hub">
<meta name="application-name" content="TUKE Hub">
<meta name="format-detection" content="telephone=no">
<meta name="telegram:channel" content="">
<title>TUKE Student Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  button{font:inherit;cursor:pointer;border:none;background:none}
  a{color:inherit}
  :root{
    --slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;
    --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --blue-300:#93c5fd;--blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;
    --emerald-300:#6ee7b7;--emerald-400:#34d399;--emerald-500:#10b981;
    --amber-400:#fbbf24;--purple-400:#c084fc;--red-400:#f87171;
    --card-bg:var(--slate-800);--page-bg:var(--slate-900);--text:var(--slate-100);--muted:var(--slate-400);
    --border:var(--slate-700);--header-bg:rgba(30,41,59,.92);
  }
  [data-theme="light"]{
    --slate-100:#0f172a;--slate-200:#1e293b;--slate-300:#334155;--slate-400:#475569;
    --slate-500:#64748b;--slate-600:#94a3b8;--slate-700:#cbd5e1;--slate-800:#f1f5f9;--slate-900:#ffffff;
    --blue-300:#1d4ed8;--blue-400:#2563eb;--blue-500:#3b82f6;--blue-600:#2563eb;
    --emerald-300:#047857;--emerald-400:#059669;--emerald-500:#10b981;
    --card-bg:#f8fafc;--page-bg:#f1f5f9;--text:#0f172a;--muted:#64748b;
    --border:#e2e8f0;--header-bg:rgba(255,255,255,.92);
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:var(--page-bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;min-height:100dvh;line-height:1.4;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:44rem;margin:0 auto;padding:0 max(1rem, env(safe-area-inset-left)) 0 max(1rem, env(safe-area-inset-right))}
  header{
    background:rgba(30,41,59,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--slate-700);position:sticky;top:0;z-index:40;
    padding-top:env(safe-area-inset-top);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0}
  .brand{display:flex;align-items:center;gap:.5rem}
  .logo{background:var(--blue-600);color:#fff;font-weight:700;padding:.5rem;border-radius:.5rem;font-size:.7rem}
  .brand h1{font-size:1.05rem;font-weight:700;color:#fff;margin:0}
  .header-right{display:flex;align-items:center;gap:.6rem}
  .clock{font-size:.75rem;color:var(--slate-300);text-align:right;line-height:1.2}
  .clock b{color:#fff;font-size:.9rem;display:block}
  .lang-switch{display:flex;gap:.25rem}
  .lang-btn{font-size:1.1rem;padding:.2rem .35rem;border-radius:.4rem;opacity:.5}
  .lang-btn.active{opacity:1;background:var(--slate-700)}

  main{padding:1.25rem 0 2.5rem}
  section{margin-bottom:1.75rem}
  h2{font-size:.8rem;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:.05em;margin:0 0 .6rem}

  .card{background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.75rem;padding:1rem}
  .status-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
  .status-title{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .status-title h2{margin:0;text-transform:none;font-size:1rem;color:#fff;font-weight:700;letter-spacing:0}
  .badge{font-size:.7rem;padding:.15rem .55rem;border-radius:999px;font-weight:600}
  .badge.open{background:rgba(16,185,129,.18);color:var(--emerald-300);border:1px solid rgba(16,185,129,.3)}
  .badge.closed{background:rgba(248,113,113,.15);color:var(--red-400);border:1px solid rgba(248,113,113,.3)}
  .status-sub{font-size:.75rem;color:var(--slate-400);margin-top:.3rem}
  .btn{font-size:.8rem;font-weight:600;padding:.65rem 1.1rem;border-radius:.6rem;transition:background .15s,transform .1s;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .btn:active{transform:scale(.97)}
  .lang-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .btn-primary{background:var(--blue-600);color:#fff}
  .btn-primary:hover{background:var(--blue-500)}
  .btn-ghost{background:var(--slate-700);color:var(--slate-100)}
  .btn-ghost:hover{background:var(--slate-600)}
  .link{font-size:.75rem;color:var(--blue-400);text-decoration:underline;text-underline-offset:2px}
  .link:hover{color:var(--blue-300)}

  .chip-row{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;-webkit-overflow-scrolling:touch}
  .chip-row::-webkit-scrollbar{height:6px}
  .chip-row::-webkit-scrollbar-thumb{background:var(--slate-600);border-radius:3px}
  .chip{flex-shrink:0;font-size:.8rem;font-weight:500;padding:.55rem .9rem;border-radius:.55rem;border:1px solid var(--slate-700);background:var(--slate-800);color:var(--slate-300);white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
  .chip:active{transform:scale(.97)}
  .chip.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff;font-weight:600}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
  .menu-item{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:1rem;display:flex;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:.6rem}
  .cat-badge{font-size:.7rem;font-weight:600;padding:.1rem .5rem;border-radius:.3rem}
  .cat-soup{color:var(--amber-400);background:rgba(251,191,36,.1)}
  .cat-menu1{color:var(--blue-400);background:rgba(96,165,250,.1)}
  .cat-menu2{color:var(--purple-400);background:rgba(192,132,252,.1)}
  .cat-salad{color:var(--emerald-400);background:rgba(52,211,153,.1)}
  .cat-other{color:var(--slate-400);background:rgba(148,163,184,.1)}
  .price{font-size:1.1rem;font-weight:700;color:var(--emerald-400);white-space:nowrap}
  .empty-box{border:1px dashed var(--slate-700);border-radius:.75rem;padding:1.5rem;text-align:center;font-size:.85rem;color:var(--slate-400)}
  .muted{font-size:.7rem;color:var(--slate-500)}

  input[type=text],input[type=number]{width:100%;background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.5rem;padding:.55rem .75rem;font-size:.85rem;color:var(--slate-100)}
  input[type=text]::placeholder,input[type=number]::placeholder{color:var(--slate-500)}
  input[type=text]:focus,input[type=number]:focus{outline:none;box-shadow:0 0 0 2px var(--blue-500)}

  #map{height:280px;width:100%;border-radius:.75rem;background:var(--slate-800);margin-bottom:.75rem}

  .discount-card{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:1rem;display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start;margin-bottom:.6rem}
  .discount-tag{font-size:.65rem;background:rgba(59,130,246,.2);color:var(--blue-300);border:1px solid rgba(59,130,246,.3);padding:.1rem .5rem;border-radius:999px}
  .fav-btn{font-size:1.35rem;color:var(--slate-600);flex-shrink:0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:.5rem}
  .fav-btn.active{color:var(--amber-400)}
  .fav-btn:active{background:var(--slate-700)}
  .nav-btns{display:flex;gap:.35rem;margin-top:.4rem;flex-wrap:wrap}
  .nav-btn{font-size:.65rem;padding:.25rem .5rem;border-radius:.35rem;background:var(--slate-700);color:var(--slate-200);text-decoration:none;display:inline-flex;align-items:center;gap:.25rem}
  .nav-btn:hover{background:var(--blue-600);color:#fff}

  .calc-card{display:grid;gap:.6rem}
  .calc-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .calc-row label{font-size:.8rem;color:var(--slate-300);min-width:7rem}
  .calc-row input[type=number]{width:7rem;background:var(--slate-900);border:1px solid var(--slate-700);border-radius:.5rem;padding:.4rem .6rem;color:var(--slate-100);font-size:.9rem}
  .calc-result{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:.5rem;padding:.75rem;margin-top:.25rem}
  .calc-result strong{color:var(--emerald-400);font-size:1.1rem}

  .dpmk-card{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:.75rem;display:flex;gap:.75rem;align-items:center;margin-bottom:.5rem}
  .dpmk-icon{font-size:1.5rem;flex-shrink:0}
  .dpmk-info{min-width:0}
  .dpmk-name{font-weight:600;font-size:.85rem}
  .dpmk-lines{font-size:.75rem;color:var(--slate-400);margin-top:.15rem}

  .skeleton{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  dialog{border:none;padding:0;background:transparent;width:100%}
  dialog::backdrop{background:rgba(2,6,23,.7)}
  .modal-box{background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.75rem;padding:1rem;width:92vw;max-width:32rem;margin:4rem auto 0}
  textarea{width:100%;background:var(--slate-900);border:1px solid var(--slate-700);border-radius:.5rem;padding:.5rem;font-size:.75rem;color:var(--slate-200);font-family:ui-monospace,Menlo,Consolas,monospace}
  textarea:focus{outline:none;box-shadow:0 0 0 2px var(--blue-500)}


  .quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.25rem}
  .quick-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
    background:var(--card-bg);border:1px solid var(--border);border-radius:.75rem;padding:.7rem .4rem;
    text-decoration:none;color:var(--text);font-size:.7rem;font-weight:600;min-height:64px;text-align:center}
  .quick-link:active{transform:scale(.97);background:var(--slate-700)}
  .quick-link span.qi{font-size:1.25rem;line-height:1}
  .today-grid{display:grid;gap:.75rem;margin-bottom:1.25rem}
  @media(min-width:560px){.today-grid{grid-template-columns:1.2fr .8fr}}
  .today-card h3{margin:0 0 .4rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .today-dishes{font-size:.85rem;margin:0;padding:0;list-style:none}
  .today-dishes li{display:flex;justify-content:space-between;gap:.5rem;padding:.25rem 0;border-bottom:1px solid var(--border)}
  .today-dishes li:last-child{border:none}
  .weather-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
  .weather-now{font-size:1.6rem;font-weight:700}
  .weather-sub{font-size:.75rem;color:var(--muted)}
  .close-warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:var(--amber-400);
    border-radius:.5rem;padding:.5rem .75rem;font-size:.8rem;font-weight:600;margin-top:.5rem;display:none}
  .close-warn.show{display:block}
  .theme-btn{min-width:44px;min-height:44px;border-radius:.5rem;font-size:1.1rem;opacity:.85}
  .theme-btn:active{background:var(--slate-700)}
  .toggle-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
  .toggle-chip{font-size:.75rem;padding:.4rem .7rem;border-radius:999px;border:1px solid var(--border);
    background:var(--card-bg);color:var(--muted);cursor:pointer;min-height:36px}
  .toggle-chip.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff;font-weight:600}
  .fav-section{margin-bottom:1rem}
  .campus-grid{display:grid;gap:.5rem}
  .campus-item{display:flex;justify-content:space-between;align-items:center;gap:.5rem;
    background:var(--card-bg);border:1px solid var(--border);border-radius:.75rem;padding:.75rem}
  .savings-grid{display:grid;gap:.5rem}
  .savings-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
  .savings-row input{width:5rem;background:var(--slate-900);border:1px solid var(--border);border-radius:.5rem;padding:.4rem;color:var(--text);font-size:16px}
  [data-theme="light"] .savings-row input,[data-theme="light"] input[type=text],[data-theme="light"] input[type=number]{background:#fff;color:#0f172a}
  [data-theme="light"] .card,[data-theme="light"] .menu-item,[data-theme="light"] .discount-card,[data-theme="light"] .dpmk-card,[data-theme="light"] .quick-link,[data-theme="light"] .campus-item{background:var(--card-bg);border-color:var(--border)}
  [data-theme="light"] header{background:var(--header-bg);border-color:var(--border)}
  [data-theme="light"] .chip{background:#fff;border-color:var(--border);color:#334155}
  [data-theme="light"] .chip.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
  @media(max-width:480px){
    .quick-links{grid-template-columns:repeat(3,1fr);gap:.4rem}
    .quick-link{font-size:.65rem;padding:.55rem .3rem;min-height:58px}
  }


  /* Motion */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes pulseSoft {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }
  .anim-in { animation: fadeUp .45s ease both; }
  .card, .menu-item, .discount-card, .dpmk-card, .campus-item, .quick-link, .news-card {
    animation: fadeUp .4s ease both;
  }
  .quick-links .quick-link:nth-child(1){animation-delay:.02s}
  .quick-links .quick-link:nth-child(2){animation-delay:.05s}
  .quick-links .quick-link:nth-child(3){animation-delay:.08s}
  .quick-links .quick-link:nth-child(4){animation-delay:.11s}
  .quick-links .quick-link:nth-child(5){animation-delay:.14s}
  .quick-links .quick-link:nth-child(6){animation-delay:.17s}
  .news-card{background:var(--card-bg);border:1px solid var(--border);border-radius:.75rem;padding:.85rem;margin-bottom:.55rem}
  .news-card a{color:var(--blue-400);text-decoration:none;font-weight:600}
  .news-card a:hover{text-decoration:underline}
  .news-meta{font-size:.7rem;color:var(--muted);margin-top:.25rem}
  .news-desc{font-size:.8rem;color:var(--slate-300);margin:.35rem 0 0;line-height:1.35}
  .news-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem}
  .news-actions .btn{min-height:36px;padding:.4rem .7rem;font-size:.7rem}
  @media (prefers-reduced-motion: reduce) {
    .anim-in, .card, .menu-item, .discount-card, .dpmk-card, .campus-item, .quick-link, .news-card {
      animation: none !important;
    }
  }


  .app-footer{
    margin:2.5rem 0 1.5rem;padding:1.25rem 1rem 2rem;
    border-top:1px solid var(--border);text-align:center;
  }
  .app-footer h2{margin:0 0 .75rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .install-cards{display:grid;gap:.75rem;margin:0 auto 1.25rem;max-width:28rem;text-align:left}
  @media(min-width:520px){.install-cards{grid-template-columns:1fr 1fr;max-width:36rem}}
  .install-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:.85rem;
    padding:1rem;animation:fadeUp .4s ease both;
  }
  .install-card h3{margin:0 0 .4rem;font-size:.9rem;display:flex;align-items:center;gap:.4rem}
  .install-card ol{margin:.4rem 0 0;padding-left:1.1rem;font-size:.75rem;color:var(--muted);line-height:1.45}
  .install-card li{margin:.2rem 0}

  .install-actions{margin-top:.75rem;display:flex;flex-direction:column;gap:.4rem}
  .install-actions .btn{width:100%;min-height:44px;font-size:.8rem}
  .ios-guide{
    display:none;margin-top:.6rem;padding:.65rem .75rem;border-radius:.6rem;
    background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);
    font-size:.75rem;color:var(--slate-200);line-height:1.4;text-align:left;
  }
  .ios-guide.show{display:block;animation:fadeUp .35s ease both}
  [data-theme="light"] .ios-guide{color:#1e293b}

  .support-note{font-size:.75rem;color:var(--muted);margin:0 auto 1.25rem;max-width:28rem;line-height:1.4}
  .credit-line{
    margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);
    font-size:.8rem;color:var(--slate-400);letter-spacing:.02em;
  }
  .credit-line strong,.credit-line a{color:var(--blue-400);font-weight:600}
  .credit-line a:hover{text-decoration:underline}
  .credit-heart{color:#f472b6}


  .offline-banner{
    display:none;position:sticky;top:0;z-index:45;margin:0 -1rem .75rem;
    padding:.55rem 1rem;background:rgba(251,191,36,.15);border-bottom:1px solid rgba(251,191,36,.4);
    color:var(--amber-400);font-size:.8rem;font-weight:600;text-align:center;
  }
  .offline-banner.show{display:block}
  .collapse-btn{
    min-width:36px;min-height:36px;border-radius:.5rem;font-size:.85rem;
    color:var(--muted);padding:.25rem .5rem;
  }
  .collapse-btn:active{background:var(--slate-700)}
  .section-body.is-collapsed{display:none}
  .share-btn{min-height:36px;padding:.35rem .65rem;font-size:.7rem}


  .nearby-box{
    background:var(--card-bg);border:1px solid var(--border);border-radius:.85rem;
    padding:.85rem;margin-bottom:1rem;animation:fadeUp .4s ease both;
  }
  .nearby-box h3{margin:0 0 .5rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .nearby-dist{font-size:.7rem;color:var(--emerald-400);font-weight:600;white-space:nowrap}


  /* Telegram / in-app browser */
  html.tg-viewport body{
    padding-top: max(env(safe-area-inset-top), var(--tg-content-safe-top, 0px));
    padding-bottom: max(env(safe-area-inset-bottom), var(--tg-content-safe-bottom, 0px));
    min-height: var(--tg-viewport-stable-height, 100dvh);
  }
  html.tg-viewport header{
    padding-top: max(env(safe-area-inset-top), var(--tg-content-safe-top, 0px));
  }
  html.tg-viewport main{
    padding-bottom: max(2.5rem, calc(1.5rem + var(--tg-content-safe-bottom, 0px)));
  }
  /* iOS Safari / Telegram: prevent rubber-band issues on sticky */
  html.ios-webview body{position:relative}
  html.ios-webview .chip-row,
  html.ios-webview #map{
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }
  /* Larger touch targets in narrow Telegram webview */
  @media (max-width: 480px) {
    .btn, .toggle-chip, .chip, .lang-btn, .theme-btn, .collapse-btn, .fav-btn, .share-btn {
      min-height: 44px;
    }
    .quick-link{min-height:64px}
    input[type=text], input[type=number]{font-size:16px !important}
  }

  /* Mobile polish */
  @media (max-width: 480px) {
    .brand h1{font-size:.95rem}
    .logo{font-size:.65rem;padding:.4rem}
    .clock{font-size:.7rem}
    .clock b{font-size:.85rem}
    .status-card{flex-direction:column;align-items:flex-start}
    .menu-item,.discount-card{padding:.85rem}
    .price{font-size:1rem}
    #map{height:14rem !important;border-radius:.75rem}
    .nav-btn{padding:.4rem .65rem;font-size:.7rem;min-height:36px}
    input[type=text],input[type=number]{font-size:16px !important} /* prevent iOS zoom */
  }
  @media (max-width: 360px) {
    .lang-switch{gap:0}
    .header-row{gap:.4rem}
  }
  /* Install banner */
  .install-banner{

/* Telegram WebApp + iOS/Android in-app browser adaptation */
(function initTelegramEnv(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isTg = !!(window.Telegram && Telegram.WebApp) || /Telegram/i.test(ua);
  if (isIOS) document.documentElement.classList.add('ios-webview');
  if (isAndroid) document.documentElement.classList.add('android-webview');
  if (!window.Telegram || !Telegram.WebApp) return;
  const tg = Telegram.WebApp;
  try {
    tg.ready();
    tg.expand();
    if (typeof tg.disableVerticalSwipes === 'function') {
      try { tg.disableVerticalSwipes(); } catch(e){}
    }
    document.documentElement.classList.add('tg-viewport');
    const applyTgCss = () => {
      const root = document.documentElement;
      const h = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
      root.style.setProperty('--tg-viewport-stable-height', h + 'px');
      const cs = tg.contentSafeAreaInset || {};
      const sa = tg.safeAreaInset || {};
      root.style.setProperty('--tg-content-safe-top', ((cs.top || 0) + (sa.top || 0)) + 'px');
      root.style.setProperty('--tg-content-safe-bottom', ((cs.bottom || 0) + (sa.bottom || 0)) + 'px');
      if (tg.colorScheme === 'light') {
        // don't force theme — user may have chosen dark in app
      }
      try {
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');
      } catch(e){}
    };
    applyTgCss();
    tg.onEvent && tg.onEvent('viewportChanged', applyTgCss);
    tg.onEvent && tg.onEvent('themeChanged', applyTgCss);
    // open external links outside Telegram when possible
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
      if (a.target === '_blank' || /^https?:/i.test(href)) {
        if (tg.openLink) {
          e.preventDefault();
          tg.openLink(href, { try_instant_view: false });
        }
      }
    }, true);
  } catch (e) {
    console.warn('Telegram WebApp init', e);
  }
})();

const LOCALE_TAG = { sk:'sk-SK', ru:'ru-RU', uk:'uk-UA', en:'en-GB' };

const Storage = {
  memory: {},
  async get(key) {
    try {
      const raw = localStorage.getItem('tuke-hub:' + key);
      if (raw != null) return JSON.parse(raw);
    } catch (e) {}
    try {
      if (window.storage) {
        const r = await window.storage.get(key, false);
        if (r) return JSON.parse(r.value);
      }
    } catch (e) {}
    return this.memory[key] ?? null;
  },
  async set(key, value) {
    this.memory[key] = value;
    try {
      localStorage.setItem('tuke-hub:' + key, JSON.stringify(value));
    } catch (e) {
      console.warn('localStorage write failed', e);
    }
    try {
      if (window.storage) await window.storage.set(key, JSON.stringify(value), false);
    } catch (e) {}
  }
};


/* Theme */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('tuke-hub:theme', theme); } catch(e){}
}
function initTheme(){
  let theme = 'dark';
  try { theme = localStorage.getItem('tuke-hub:theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch(e){}
  applyTheme(theme);
  document.getElementById('theme-btn')?.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
  });
}

let lang = 'ru';
function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }

function applyStaticTranslations(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('discount-search').placeholder = t('searchPlaceholder');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

function detectLang(){
  const supported = ['sk','ru','uk','en'];
  const navLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of navLangs) {
    const base = String(l).toLowerCase().split('-')[0];
    if (supported.includes(base)) return base;
  }
  return 'en';
}

async function setLang(newLang, persist){
  lang = newLang;
  applyStaticTranslations();
  renderDaySelector();
  await loadAndRenderMenu();
  await renderTodayBlock();
  renderCategoryFilter();
  renderDiscounts();
  renderDPMK();
  renderSubsidyCalc();
  if (persist) await Storage.set('lang', newLang);
}

const CANTEEN_OPEN_WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];
const CANTEEN_OPEN_HOUR = 7, CANTEEN_CLOSE_HOUR = 14;

function getBratislavaParts(){
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Bratislava', hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit' });
  const map = {};
  fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
  return { weekday: map.weekday, hour: parseInt(map.hour,10) === 24 ? 0 : parseInt(map.hour,10), minute: parseInt(map.minute,10) };
}

function updateClockAndStatus(){
  const { weekday, hour, minute } = getBratislavaParts();
  const displayTime = new Intl.DateTimeFormat(LOCALE_TAG[lang] || 'en-GB', { timeZone:'Europe/Bratislava', hour:'2-digit', minute:'2-digit' }).format(new Date());
  document.getElementById('clock-time').textContent = displayTime;

  const isWeekday = CANTEEN_OPEN_WEEKDAYS.includes(weekday);
  const minutesNow = hour * 60 + minute;
  const isOpen = isWeekday && minutesNow >= CANTEEN_OPEN_HOUR * 60 && minutesNow < CANTEEN_CLOSE_HOUR * 60;

  const badge = document.getElementById('open-badge');
  badge.textContent = isOpen ? t('statusOpen') : t('statusClosed');
  badge.className = 'badge ' + (isOpen ? 'open' : 'closed');

  const sub = document.getElementById('status-sub');
  if (!isWeekday) {
    sub.textContent = t('closedWeekendLabel') + ' · ' + t('hoursNote');
  } else if (isOpen) {
    sub.textContent = t('closesAtLabel') + ' ' + String(CANTEEN_CLOSE_HOUR).padStart(2,'0') + ':00 · ' + t('hoursNote');
  } else {
    sub.textContent = t('opensAtLabel') + ' ' + String(CANTEEN_OPEN_HOUR).padStart(2,'0') + ':00 · ' + t('hoursNote');
  }
}

const WEEKDAY_KEYS = ['Mon','Tue','Wed','Thu','Fri'];
const CATEGORY_MAP = [
  { re:/polievka/i, cls:'cat-soup', key:'catSoup' },
  { re:/menu\s*1/i, cls:'cat-menu1', key:'catMenu1' },
  { re:/menu\s*2/i, cls:'cat-menu2', key:'catMenu2' },
  { re:/šalát|salat/i, cls:'cat-salad', key:'catSalad' }
];
function categoryStyle(rawCategory){
  const m = CATEGORY_MAP.find(c => c.re.test(rawCategory || ''));
  return m || { cls:'cat-other', key:'catOther' };
}

function currentWeekMonday(d = new Date()){
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + ((day === 0 ? -6 : 1) - day));
  date.setHours(0,0,0,0);
  return date;
}
function fmtKey(d){ return d.toISOString().slice(0,10); }

function buildWeek(){
  const monday = currentWeekMonday();
  return WEEKDAY_KEYS.map((wk, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return { wk, date: d, key: fmtKey(d) };
  });
}
const week = buildWeek();

if (!week.find(w => w.key === selectedDayKey)) selectedDayKey = week[0].key;

function parseMenuText(raw){
  const priceRe = /(\d+[.,]\d{2})\s*€?/;
  const lines = String(raw).split(/\r?\n/).map(l => l.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').trim()).filter(Boolean);
  const items = [];
  let currentCategory = 'Iné';
  lines.forEach(line => {
    const hasPrice = priceRe.test(line);
    const catMatch = CATEGORY_MAP.find(c => c.re.test(line));
    if (catMatch && !hasPrice) {
      currentCategory = catMatch.key === 'catSoup' ? 'Polievka'
        : catMatch.key === 'catMenu1' ? 'Menu 1'
        : catMatch.key === 'catMenu2' ? 'Menu 2'
        : catMatch.key === 'catSalad' ? 'Šalát'
        : line;
      return;
    }
    if (!hasPrice) return;
    const m = line.match(priceRe);
    if (!m) return;
    const price = parseFloat(m[1].replace(',', '.'));
    let name = line.replace(priceRe, '').replace(/€/g, '').trim().replace(/[-–:]+$/, '').trim();
    if (catMatch) {
      currentCategory = catMatch.key === 'catSoup' ? 'Polievka'
        : catMatch.key === 'catMenu1' ? 'Menu 1'
        : catMatch.key === 'catMenu2' ? 'Menu 2'
        : catMatch.key === 'catSalad' ? 'Šalát'
        : currentCategory;
    }
    if (name && !isNaN(price)) items.push({ rawCategory: currentCategory, name, price });
  });
  return items;
}

/* GitHub Pages auto-fetch: reads data/menu.json from the same repo */
async function tryAutoFetchMenu(dayKey){
  try {
    const res = await fetch('data/menu.json', { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.date === dayKey && Array.isArray(data.items) && data.items.length) {
      await Storage.set(`menu:${dayKey}`, { items: data.items, updatedAt: Date.now(), auto: true });
      return data.items;
    }
  } catch (e) { console.warn('Auto-fetch from repo failed', e); }
  return null;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDaySelector(){

    const btn = document.createElement('button');

    btn.textContent = label;
    btn.onclick = () => { selectedDayKey = w.key; renderDaySelector(); loadAndRenderMenu(); };

}

async function loadAndRenderMenu(){
  const listEl = document.getElementById('menu-list');
  const statusEl = document.getElementById('menu-status');
  document.getElementById('official-link').href = officialUrlFor(selectedDayKey);

  listEl.innerHTML = `<div class="skeleton"><div class="menu-item" style="height:3.5rem"></div><div class="menu-item" style="height:3.5rem"></div></div>`;

  let saved = null;
  try { saved = await Storage.get(`menu:${selectedDayKey}`); } catch (e) {}

  let items = null;
  if (saved && saved.items && saved.items.length) {
    items = saved.items;
    statusEl.textContent = (saved.auto ? 'Auto-fetched: ' : t('updatedManual')) + new Date(saved.updatedAt).toLocaleString(LOCALE_TAG[lang] || 'en-GB');
  } else {
    items = await tryAutoFetchMenu(selectedDayKey);
    if (items) {
      statusEl.textContent = 'Auto-fetched: ' + new Date().toLocaleString(LOCALE_TAG[lang] || 'en-GB');
    }
  }

  const isToday = selectedDayKey === fmtKey(new Date());
  if (!items) items = isToday ? DEMO_MENU : null;

  if (!items || !items.length) {
    listEl.innerHTML = `<div class="empty-box"><strong>${t('noMenuTitle')}</strong><br>${t('noMenuDesc')}</div>`;
    statusEl.textContent = '';
    return;
  }

  if (!statusEl.textContent) statusEl.textContent = t('demoTag');

  listEl.innerHTML = items.map(item => {
    const style = categoryStyle(item.rawCategory);
    return `
      <div class="menu-item">
        <div style="min-width:0">
          <span class="cat-badge ${style.cls}">${escapeHtml(t(style.key))}</span>
          <div style="margin-top:.3rem;font-weight:500">${escapeHtml(item.name)}</div>
        </div>
        <div class="price">${item.price != null ? item.price.toFixed(2) + ' €' : '—'}</div>
      </div>`;
  }).join('');
}

function matchesQuery(spot, q){
  if (!q) return true;
  q = q.toLowerCase();
  const addr = (spot.addr || '').toLowerCase();
  return spot.name.toLowerCase().includes(q) || addr.includes(q);
}


function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDistance(km) {
  if (km < 1) return Math.round(km * 1000) + ' ' + t('nearbyM');
  return km.toFixed(1) + ' ' + t('nearbyKm');
}
function renderNearbyList(userLat, userLng) {
  const list = document.getElementById('nearby-list');
  const status = document.getElementById('nearby-status');
  if (!list) return;
  const ranked = DISCOUNT_SPOTS
    .filter(s => s.lat != null && s.lng != null && !isNaN(Number(s.lat)) && !isNaN(Number(s.lng)))
    .map(s => ({ ...s, _km: haversineKm(userLat, userLng, Number(s.lat), Number(s.lng)) }))
    .sort((a, b) => a._km - b._km)
    .slice(0, 3);
  if (!ranked.length) {
    list.innerHTML = '';
    if (status) status.textContent = t('nearbyNone');
    return;
  }
  if (status) status.textContent = '';
  list.innerHTML = ranked.map((spot, i) => {
    const addr = spot.addr || t('multipleBranches');
    const ph = typeof spot.phrase === 'string' && !String(spot.phrase).startsWith('discount') && !String(spot.phrase).startsWith('subsidy')
      ? spot.phrase : t(spot.phrase);
    return `<div class="discount-card" style="animation-delay:${i*0.05}s">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <strong>${i+1}. ${escapeHtml(spot.name)}</strong>
          <span class="nearby-dist">${formatDistance(spot._km)}</span>
        </div>
        <span class="discount-tag">${escapeHtml(ph || '')}</span>
        <p class="muted" style="margin:.25rem 0 0">📍 ${escapeHtml(addr)}</p>
        <div class="nav-btns">${navLinks(spot.lat, spot.lng)}</div>
      </div>
    </div>`;
  }).join('');
  // also center map on user if available
  if (map && mapReady) {
    try {
      map.setView([userLat, userLng], 14);
      if (window._userMarker) map.removeLayer(window._userMarker);
      window._userMarker = L.circleMarker([userLat, userLng], {
        radius: 10, color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.85, weight: 3
      }).addTo(map).bindPopup(t('youAreHere') || 'You');
    } catch(e){}
  }
}
function findNearbyDiscounts() {
  const status = document.getElementById('nearby-status');
  const btn = document.getElementById('nearby-btn');
  if (!navigator.geolocation) {
    if (status) status.textContent = t('nearbyDenied');
    return;
  }
  if (btn) btn.disabled = true;
  if (status) status.textContent = t('nearbyLoading');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      renderNearbyList(pos.coords.latitude, pos.coords.longitude);
      if (btn) btn.disabled = false;
    },
    () => {
      if (status) status.textContent = t('nearbyDenied');
      if (btn) btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}


function isKosiceSpot(s){
  if (s.city && /ko[sš]ice/i.test(s.city)) return true;
  if (s.addr && /ko[sš]ice/i.test(s.addr)) return true;
  const lat = Number(s.lat), lng = Number(s.lng);
  if (!isNaN(lat) && !isNaN(lng)) return lat > 48.65 && lat < 48.80 && lng > 21.15 && lng < 21.40;
  return false;
}

async function toggleFavorite(id){
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  await Storage.set('discount-favorites', favorites);
  renderDiscounts();
}

function initMap(){
  if (map) return;
  try {
    if (typeof L === 'undefined') throw new Error('Leaflet failed to load');
    map = L.map('map').setView([48.7250, 21.2530], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
    mapReady = true;
    addCampusMarkersToMap();
    enableGeolocation();
  } catch (e) {
    console.warn('Map unavailable:', e);
    document.getElementById('map').style.display = 'none';
    document.getElementById('map-fallback').style.display = 'block';
    document.getElementById('map-fallback').textContent = t('mapFallback');
  }
  renderDiscounts();
}

function renderSubsidyCalc(){
  const totalEl = document.getElementById('calc-total');
  const mealsEl = document.getElementById('calc-meals');
  const resultBox = document.getElementById('calc-result');
  const subsidyEl = document.getElementById('calc-subsidy');
  const finalEl = document.getElementById('calc-final');

  function calc(){
    const total = parseFloat(totalEl.value) || 0;
    const meals = parseInt(mealsEl.value) || 1;
    let subsidy = 0;
    if (total > 7.99 && meals >= 2) subsidy = 4.00;
    else if (total > 3.99) subsidy = 2.00;

    if (total <= 0) { resultBox.style.display = 'none'; return; }
    resultBox.style.display = 'block';
    subsidyEl.textContent = subsidy.toFixed(2) + ' €';
    if (subsidy > 0) {
      finalEl.textContent = t('calcResult') + ' ' + (total - subsidy).toFixed(2) + ' €';
    } else {
      finalEl.textContent = t('calcNoSubsidy');
    }
  }
  totalEl.oninput = calc;
  mealsEl.oninput = calc;
}

/* Weather Open-Meteo */
const WMO = {0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',63:'🌧',65:'🌧',71:'🌨',73:'🌨',80:'🌦',95:'⛈'};
async function loadWeather(){
  const tempEl = document.getElementById('weather-temp');
  const descEl = document.getElementById('weather-desc');
  const dailyEl = document.getElementById('weather-daily');
  if (!tempEl) return;
  descEl.textContent = t('weatherLoading');
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=48.7164&longitude=21.2611&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBratislava&forecast_days=3';
    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current;
    const icon = WMO[cur.weather_code] || '🌡';
    tempEl.textContent = `${icon} ${Math.round(cur.temperature_2m)}°C`;
    descEl.textContent = 'Košice';
    const d = data.daily;
    let htmlW = '';
    for (let i = 0; i < Math.min(3, d.time.length); i++) {
      const day = new Date(d.time[i] + 'T12:00:00');
      const label = i === 0 ? (lang==='sk'?'Dnes':lang==='ru'?'Сегодня':lang==='uk'?'Сьогодні':'Today')
        : new Intl.DateTimeFormat(LOCALE_TAG[lang]||'en-GB',{weekday:'short'}).format(day);
      const ic = WMO[d.weather_code[i]] || '';
      htmlW += `<div>${label}: ${ic} ${Math.round(d.temperature_2m_min[i])}°…${Math.round(d.temperature_2m_max[i])}°</div>`;
    }
    dailyEl.innerHTML = htmlW;
  } catch (e) {
    tempEl.textContent = '—';
    descEl.textContent = 'Open-Meteo offline';
  }
}

function updateCloseWarning(){
  const el = document.getElementById('close-warn');
  if (!el) return;
  const { weekday, hour, minute } = getBratislavaParts();
  const isWeekday = CANTEEN_OPEN_WEEKDAYS.includes(weekday);
  const minutesNow = hour * 60 + minute;
  const closeM = CANTEEN_CLOSE_HOUR * 60;
  const openM = CANTEEN_OPEN_HOUR * 60;
  const isOpen = isWeekday && minutesNow >= openM && minutesNow < closeM;
  if (isOpen && (closeM - minutesNow) <= 30) {
    el.textContent = t('closeSoon');
    el.classList.add('show');
  } else el.classList.remove('show');
}

const NEWS_FEED = 'https://api.prod.tuke.sk/feed/1/sk/articles-feed';
let newsItems = [];
let newsTranslated = false;

function parseRss(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const items = [...doc.querySelectorAll('item')].slice(0, 8);
  return items.map((it, i) => {
    const title = (it.querySelector('title')?.textContent || '').trim();
    let link = (it.querySelector('link')?.textContent || '').trim();
    // RSS отдаёт битые URL вида https://tuke.sk/1/sk/... → правильный путь без /1/
    link = link
      .replace(/^https?:\/\/tuke\.sk\/1\//i, 'https://www.tuke.sk/')
      .replace(/^https?:\/\/www\.tuke\.sk\/1\//i, 'https://www.tuke.sk/')
      .replace(/^https?:\/\/tuke\.sk\//i, 'https://www.tuke.sk/');
    const desc = (it.querySelector('description')?.textContent || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const date = it.querySelector('pubDate')?.textContent || '';
    const cat = it.querySelector('category')?.textContent || '';
    return { id: i, title, link, desc, date, cat, titleTr: null, descTr: null };
  });
}

async function translateText(text, toLang) {
  if (!text || toLang === 'sk') return text;
  const pair = 'sk|' + (toLang === 'uk' ? 'uk' : toLang === 'ru' ? 'ru' : 'en');
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 450)) + '&langpair=' + pair;
  const res = await fetch(url);
  const data = await res.json();
  const out = data?.responseData?.translatedText;
  if (!out || /INVALID|QUERY LENGTH/i.test(out)) return text;
  return out;
}

async function translateNewsToLang() {
  const status = document.getElementById('news-status');
  const btn = document.getElementById('news-translate-btn');
  if (lang === 'sk') {
    newsTranslated = false;
    renderNewsList();
    return;
  }
  if (btn) btn.disabled = true;
  if (status) status.textContent = t('newsLoading');
  for (const item of newsItems) {
    if (!item.titleTr) item.titleTr = await translateText(item.title, lang);
    if (!item.descTr && item.desc) item.descTr = await translateText(item.desc, lang);
  }
  newsTranslated = true;
  if (btn) btn.disabled = false;
  renderNewsList();
  if (status) status.textContent = t('newsTranslated');
}

function getVisibleNews(){
  if (!newsNovinkyOnly) return newsItems;
  return newsItems.filter(it => {
    const c = (it.cat || '').toLowerCase();
    // hide job listings by default
    if (/pracov|job|career|miesta|výberové|vyberove/i.test(c + ' ' + it.title)) return false;
    if (/novinky|news|aktualit/i.test(c)) return true;
    // if no category, keep non-job titles
    return !/výberové konanie|vyberove konanie/i.test(it.title);
  });
}
function renderNewsList() {
  const el = document.getElementById('news-list');
  if (!el) return;
  const visible = getVisibleNews();
  if (!visible.length) {
    el.innerHTML = `<div class="empty-box">${escapeHtml(t('newsError'))}</div>`;
    return;
  }
  el.innerHTML = visible.map((item, idx) => {
    const title = newsTranslated && item.titleTr ? item.titleTr : item.title;
    const desc = newsTranslated && item.descTr ? item.descTr : item.desc;
    const d = item.date ? new Date(item.date) : null;
    const dateStr = d && !isNaN(d) ? d.toLocaleDateString(LOCALE_TAG[lang] || 'sk-SK', { day:'2-digit', month:'short', year:'numeric' }) : '';
    return `<article class="news-card" style="animation-delay:${idx * 0.04}s">
      <a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
      <div class="news-meta">${escapeHtml(item.cat)}${dateStr ? ' · ' + dateStr : ''}</div>
      ${desc ? `<p class="news-desc">${escapeHtml(desc)}</p>` : ''}
    </article>`;
  }).join('');
}

async function loadNews() {
  const status = document.getElementById('news-status');
  if (status) status.textContent = t('newsLoading');
  try {
    const res = await fetch(NEWS_FEED, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    newsItems = parseRss(text);
    newsTranslated = false;
    renderNewsList();
    if (status) status.textContent = '';
  } catch (e) {
    console.warn('news', e);
    if (status) status.textContent = t('newsError');
    const el = document.getElementById('news-list');
    if (el) el.innerHTML = `<div class="empty-box">${escapeHtml(t('newsError'))} <a class="link" href="https://www.tuke.sk/sk" target="_blank">tuke.sk</a></div>`;
  }
}

async function init(){
  initTheme();
  let stored = null;
  try { stored = await Storage.get('lang'); } catch (e) {}
  lang = stored || detectLang();
  applyStaticTranslations();

  renderQuickLinks();
  renderCampus();
  renderBuses();
  renderDaySelector();
  await loadAndRenderMenu();
  await renderTodayBlock();
  await loadDiscountsFromRepo();
  try { favorites = (await Storage.get('discount-favorites')) || []; } catch (e) { favorites = []; }
  try { kosiceOnly = !!(await Storage.get('kosice-only')); } catch(e){}
  const kbtn = document.getElementById('kosice-only-btn');
  if (kbtn) {
    kbtn.classList.toggle('active', kosiceOnly);
    kbtn.onclick = async () => {
      kosiceOnly = !kosiceOnly;
      kbtn.classList.toggle('active', kosiceOnly);
      await Storage.set('kosice-only', kosiceOnly);
      renderDiscounts();
    };
  }
  document.getElementById('nearby-btn')?.addEventListener('click', findNearbyDiscounts);
  renderCategoryFilter();
  renderDiscounts();
  renderSubsidyCalc();
  renderDPMK();
  renderSavings();
  ['sav-meals','sav-meal-eur','sav-transport','sav-other'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', renderSavings);
  });

  updateClockAndStatus();
  updateCloseWarning();
  setInterval(() => { updateClockAndStatus(); updateCloseWarning(); }, 30000);
  loadWeather();
  loadNews();
  setupCollapse();
  setupOfflineBanner();
  document.getElementById('share-menu-btn')?.addEventListener('click', shareMenu);
  const novBtn = document.getElementById('news-novinky-only');
  if (novBtn) {
    try { newsNovinkyOnly = localStorage.getItem('tuke-hub:news-novinky') !== '0'; } catch(e){}
    novBtn.classList.toggle('active', newsNovinkyOnly);
    novBtn.onclick = () => {
      newsNovinkyOnly = !newsNovinkyOnly;
      novBtn.classList.toggle('active', newsNovinkyOnly);
      try { localStorage.setItem('tuke-hub:news-novinky', newsNovinkyOnly ? '1' : '0'); } catch(e){}
      renderNewsList();
    };
  }
  document.getElementById('news-translate-btn')?.addEventListener('click', () => {
    if (newsTranslated) {
      newsTranslated = false;
      renderNewsList();
      const st = document.getElementById('news-status');
      if (st) st.textContent = '';
    } else {
      translateNewsToLang();
    }
  });
  setTimeout(initMap, 50);
}

init();

});

document.getElementById('install-btn')?.addEventListener('click', () => promptPwaInstall());
document.getElementById('android-install-btn')?.addEventListener('click', () => promptPwaInstall());

document.getElementById('install-dismiss')?.addEventListener('click', () => {
  localStorage.setItem('tuke-hub:hide-install', '1');
  banner?.classList.remove('show');
});

async function copyPageLink() {
  try {
    await navigator.clipboard.writeText(location.href);
    alert((typeof t === 'function' ? t('linkCopied') : null) || 'OK');
  } catch (e) {
    prompt('URL', location.href);
  }
}
document.getElementById('android-copy-btn')?.addEventListener('click', copyPageLink);
document.getElementById('ios-copy-btn')?.addEventListener('click', copyPageLink);

document.getElementById('ios-guide-btn')?.addEventListener('click', () => {
  const g = document.getElementById('ios-guide');
  if (!g) return;
  const show = !g.classList.contains('show');
  g.classList.toggle('show', show);
  if (show && typeof t === 'function') g.textContent = t('iosGuideDetail');
});
</script>
</body>
</html>
