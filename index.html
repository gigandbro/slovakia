<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUKE Student Hub</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  button{font:inherit;cursor:pointer;border:none;background:none}
  a{color:inherit}
  :root{
    --slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;
    --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --blue-300:#93c5fd;--blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;
    --emerald-300:#6ee7b7;--emerald-400:#34d399;--emerald-500:#10b981;
    --amber-400:#fbbf24;--purple-400:#c084fc;--red-400:#f87171;
  }
  body{background:var(--slate-900);color:var(--slate-100);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;line-height:1.4}
  .wrap{max-width:44rem;margin:0 auto;padding:0 1rem}
  header{background:rgba(30,41,59,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--slate-700);position:sticky;top:0;z-index:40}
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0}
  .brand{display:flex;align-items:center;gap:.5rem}
  .logo{background:var(--blue-600);color:#fff;font-weight:700;padding:.5rem;border-radius:.5rem;font-size:.7rem}
  .brand h1{font-size:1.05rem;font-weight:700;color:#fff;margin:0}
  .header-right{display:flex;align-items:center;gap:.6rem}
  .clock{font-size:.75rem;color:var(--slate-300);text-align:right;line-height:1.2}
  .clock b{color:#fff;font-size:.9rem;display:block}
  .lang-switch{display:flex;gap:.25rem}
  .lang-btn{font-size:1.1rem;padding:.2rem .35rem;border-radius:.4rem;opacity:.5}
  .lang-btn.active{opacity:1;background:var(--slate-700)}

  main{padding:1.25rem 0 2.5rem}
  section{margin-bottom:1.75rem}
  h2{font-size:.8rem;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:.05em;margin:0 0 .6rem}

  .card{background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.75rem;padding:1rem}
  .status-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
  .status-title{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .status-title h2{margin:0;text-transform:none;font-size:1rem;color:#fff;font-weight:700;letter-spacing:0}
  .badge{font-size:.7rem;padding:.15rem .55rem;border-radius:999px;font-weight:600}
  .badge.open{background:rgba(16,185,129,.18);color:var(--emerald-300);border:1px solid rgba(16,185,129,.3)}
  .badge.closed{background:rgba(248,113,113,.15);color:var(--red-400);border:1px solid rgba(248,113,113,.3)}
  .status-sub{font-size:.75rem;color:var(--slate-400);margin-top:.3rem}
  .btn{font-size:.75rem;font-weight:600;padding:.5rem 1rem;border-radius:.5rem;transition:background .15s}
  .btn-primary{background:var(--blue-600);color:#fff}
  .btn-primary:hover{background:var(--blue-500)}
  .btn-ghost{background:var(--slate-700);color:var(--slate-100)}
  .btn-ghost:hover{background:var(--slate-600)}
  .link{font-size:.75rem;color:var(--blue-400);text-decoration:underline;text-underline-offset:2px}
  .link:hover{color:var(--blue-300)}

  .chip-row{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;-webkit-overflow-scrolling:touch}
  .chip-row::-webkit-scrollbar{height:6px}
  .chip-row::-webkit-scrollbar-thumb{background:var(--slate-600);border-radius:3px}
  .chip{flex-shrink:0;font-size:.75rem;font-weight:500;padding:.4rem .75rem;border-radius:.5rem;border:1px solid var(--slate-700);background:var(--slate-800);color:var(--slate-300);white-space:nowrap}
  .chip.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff;font-weight:600}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
  .menu-item{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:1rem;display:flex;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:.6rem}
  .cat-badge{font-size:.7rem;font-weight:600;padding:.1rem .5rem;border-radius:.3rem}
  .cat-soup{color:var(--amber-400);background:rgba(251,191,36,.1)}
  .cat-menu1{color:var(--blue-400);background:rgba(96,165,250,.1)}
  .cat-menu2{color:var(--purple-400);background:rgba(192,132,252,.1)}
  .cat-salad{color:var(--emerald-400);background:rgba(52,211,153,.1)}
  .cat-other{color:var(--slate-400);background:rgba(148,163,184,.1)}
  .price{font-size:1.1rem;font-weight:700;color:var(--emerald-400);white-space:nowrap}
  .empty-box{border:1px dashed var(--slate-700);border-radius:.75rem;padding:1.5rem;text-align:center;font-size:.85rem;color:var(--slate-400)}
  .muted{font-size:.7rem;color:var(--slate-500)}

  input[type=text],input[type=number]{width:100%;background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.5rem;padding:.55rem .75rem;font-size:.85rem;color:var(--slate-100)}
  input[type=text]::placeholder,input[type=number]::placeholder{color:var(--slate-500)}
  input[type=text]:focus,input[type=number]:focus{outline:none;box-shadow:0 0 0 2px var(--blue-500)}

  #map{height:280px;width:100%;border-radius:.75rem;background:var(--slate-800);margin-bottom:.75rem}

  .discount-card{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:1rem;display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start;margin-bottom:.6rem}
  .discount-tag{font-size:.65rem;background:rgba(59,130,246,.2);color:var(--blue-300);border:1px solid rgba(59,130,246,.3);padding:.1rem .5rem;border-radius:999px}
  .fav-btn{font-size:1.2rem;color:var(--slate-600);flex-shrink:0}
  .fav-btn.active{color:var(--amber-400)}
  .nav-btns{display:flex;gap:.35rem;margin-top:.4rem;flex-wrap:wrap}
  .nav-btn{font-size:.65rem;padding:.25rem .5rem;border-radius:.35rem;background:var(--slate-700);color:var(--slate-200);text-decoration:none;display:inline-flex;align-items:center;gap:.25rem}
  .nav-btn:hover{background:var(--blue-600);color:#fff}

  .calc-card{display:grid;gap:.6rem}
  .calc-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .calc-row label{font-size:.8rem;color:var(--slate-300);min-width:7rem}
  .calc-row input[type=number]{width:7rem;background:var(--slate-900);border:1px solid var(--slate-700);border-radius:.5rem;padding:.4rem .6rem;color:var(--slate-100);font-size:.9rem}
  .calc-result{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:.5rem;padding:.75rem;margin-top:.25rem}
  .calc-result strong{color:var(--emerald-400);font-size:1.1rem}

  .dpmk-card{background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.6);border-radius:.75rem;padding:.75rem;display:flex;gap:.75rem;align-items:center;margin-bottom:.5rem}
  .dpmk-icon{font-size:1.5rem;flex-shrink:0}
  .dpmk-info{min-width:0}
  .dpmk-name{font-weight:600;font-size:.85rem}
  .dpmk-lines{font-size:.75rem;color:var(--slate-400);margin-top:.15rem}

  .skeleton{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  dialog{border:none;padding:0;background:transparent;width:100%}
  dialog::backdrop{background:rgba(2,6,23,.7)}
  .modal-box{background:var(--slate-800);border:1px solid var(--slate-700);border-radius:.75rem;padding:1rem;width:92vw;max-width:32rem;margin:4rem auto 0}
  textarea{width:100%;background:var(--slate-900);border:1px solid var(--slate-700);border-radius:.5rem;padding:.5rem;font-size:.75rem;color:var(--slate-200);font-family:ui-monospace,Menlo,Consolas,monospace}
  textarea:focus{outline:none;box-shadow:0 0 0 2px var(--blue-500)}
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div class="brand">
      <div class="logo">TUKE</div>
      <h1>Kosice Student Hub</h1>
    </div>
    <div class="header-right">
      <div class="clock">
        <span data-i18n="clockLabel"></span>
        <b id="clock-time">--:--</b>
      </div>
      <div class="lang-switch" id="lang-switch">
        <button class="lang-btn" data-lang="sk" title="Slovenčina">🇸🇰</button>
        <button class="lang-btn" data-lang="ru" title="Русский">🇷🇺</button>
        <button class="lang-btn" data-lang="uk" title="Українська">🇺🇦</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="card status-card">
    <div>
      <div class="status-title">
        <h2>Jedáleň Němcovej</h2>
        <span id="open-badge" class="badge closed">…</span>
      </div>
      <p class="status-sub" id="status-sub">…</p>
      <p class="status-sub" data-i18n="canteenSub"></p>
    </div>
  </section>

  <section id="menu-section">
    <div class="row-between">
      <h2 data-i18n="headingMenu"></h2>
      <a id="official-link" class="link" href="#" target="_blank" rel="noopener" data-i18n="linkOriginal"></a>
    </div>
    <div id="day-selector" class="chip-row" style="margin-bottom:.75rem"></div>
    <div id="menu-status" class="muted" style="margin-bottom:.5rem"></div>
    <div id="menu-list"></div>
  </section>

  <section id="subsidy-section">
    <h2 data-i18n="headingSubsidy"></h2>
    <div class="card calc-card">
      <p class="muted" data-i18n="subsidyDesc" style="margin:0 0 .5rem"></p>
      <div class="calc-row">
        <label data-i18n="lblTotal"></label>
        <input type="number" id="calc-total" step="0.01" min="0" placeholder="0.00">
        <span>€</span>
      </div>
      <div class="calc-row">
        <label data-i18n="lblMeals"></label>
        <input type="number" id="calc-meals" min="1" max="10" value="1" style="width:4rem">
      </div>
      <div class="calc-result" id="calc-result" style="display:none">
        <span data-i18n="lblSubsidy"></span> <strong id="calc-subsidy">0.00 €</strong><br>
        <span class="muted" id="calc-final" style="font-size:.75rem"></span>
      </div>
      <p class="muted" style="margin:.5rem 0 0; font-size:.7rem" data-i18n="subsidyNote"></p>
    </div>
  </section>

  <section id="discounts-section">
    <h2 data-i18n="headingMap"></h2>
    <div id="map"></div>
    <p class="muted" id="map-fallback" style="display:none"></p>
    <p class="muted" id="approx-note" style="margin:-0.4rem 0 .75rem"></p>

    <div class="row-between">
      <span></span>
      <a class="link" id="isic-official-link" href="https://isic.sk/zlavy-na-slovensku/" target="_blank" rel="noopener" data-i18n="allDiscountsLinkText"></a>
    </div>

    <input type="text" id="discount-search" style="margin-bottom:.75rem">

    <div id="category-filter" class="chip-row" style="margin-bottom:.75rem"></div>

    <div id="discounts-list"></div>
    <p class="empty-box" id="discounts-empty" style="display:none"></p>
    <p class="muted" id="discounts-source-note" style="margin-top:.5rem"></p>
  </section>

  <section id="dpmk-section">
    <h2 data-i18n="headingDPMK"></h2>
    <div id="dpmk-list"></div>
    <p class="muted" style="margin-top:.5rem" data-i18n="dpmkNote"></p>
  </section>

</main>

const Storage = {
  memory: {},
  async get(key) {
    try {
      const raw = localStorage.getItem('tuke-hub:' + key);
      if (raw != null) return JSON.parse(raw);
    } catch (e) {}
    try {
      if (window.storage) {
        const r = await window.storage.get(key, false);
        if (r) return JSON.parse(r.value);
      }
    } catch (e) {}
    return this.memory[key] ?? null;
  },
  async set(key, value) {
    this.memory[key] = value;
    try {
      localStorage.setItem('tuke-hub:' + key, JSON.stringify(value));
    } catch (e) {
      console.warn('localStorage write failed', e);
    }
    try {
      if (window.storage) await window.storage.set(key, JSON.stringify(value), false);
    } catch (e) {}
  }
};

function applyStaticTranslations(){

  document.getElementById('discount-search').placeholder = t('searchPlaceholder');

function detectLang(){
  const supported = ['sk','ru','uk','en'];
  const navLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of navLangs) {
    const base = String(l).toLowerCase().split('-')[0];
    if (supported.includes(base)) return base;
  }
  return 'en';
}

}

const CANTEEN_OPEN_WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];
const CANTEEN_OPEN_HOUR = 7, CANTEEN_CLOSE_HOUR = 14;

function getBratislavaParts(){
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Bratislava', hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit' });
  const map = {};
  fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
  return { weekday: map.weekday, hour: parseInt(map.hour,10) === 24 ? 0 : parseInt(map.hour,10), minute: parseInt(map.minute,10) };
}

function updateClockAndStatus(){
  const { weekday, hour, minute } = getBratislavaParts();
  const displayTime = new Intl.DateTimeFormat(LOCALE_TAG[lang] || 'en-GB', { timeZone:'Europe/Bratislava', hour:'2-digit', minute:'2-digit' }).format(new Date());
  document.getElementById('clock-time').textContent = displayTime;

  const isWeekday = CANTEEN_OPEN_WEEKDAYS.includes(weekday);
  const minutesNow = hour * 60 + minute;
  const isOpen = isWeekday && minutesNow >= CANTEEN_OPEN_HOUR * 60 && minutesNow < CANTEEN_CLOSE_HOUR * 60;

  const badge = document.getElementById('open-badge');
  badge.textContent = isOpen ? t('statusOpen') : t('statusClosed');
  badge.className = 'badge ' + (isOpen ? 'open' : 'closed');

  const sub = document.getElementById('status-sub');
  if (!isWeekday) {
    sub.textContent = t('closedWeekendLabel') + ' · ' + t('hoursNote');
  } else if (isOpen) {
    sub.textContent = t('closesAtLabel') + ' ' + String(CANTEEN_CLOSE_HOUR).padStart(2,'0') + ':00 · ' + t('hoursNote');
  } else {
    sub.textContent = t('opensAtLabel') + ' ' + String(CANTEEN_OPEN_HOUR).padStart(2,'0') + ':00 · ' + t('hoursNote');
  }
}

const WEEKDAY_KEYS = ['Mon','Tue','Wed','Thu','Fri'];
const CATEGORY_MAP = [
  { re:/polievka/i, cls:'cat-soup', key:'catSoup' },
  { re:/menu\s*1/i, cls:'cat-menu1', key:'catMenu1' },
  { re:/menu\s*2/i, cls:'cat-menu2', key:'catMenu2' },
  { re:/šalát|salat/i, cls:'cat-salad', key:'catSalad' }
];
function categoryStyle(rawCategory){
  const m = CATEGORY_MAP.find(c => c.re.test(rawCategory || ''));
  return m || { cls:'cat-other', key:'catOther' };
}

function currentWeekMonday(d = new Date()){
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + ((day === 0 ? -6 : 1) - day));
  date.setHours(0,0,0,0);
  return date;
}
function fmtKey(d){ return d.toISOString().slice(0,10); }

function buildWeek(){
  const monday = currentWeekMonday();
  return WEEKDAY_KEYS.map((wk, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return { wk, date: d, key: fmtKey(d) };
  });
}
const week = buildWeek();
let selectedDayKey = fmtKey(new Date());
if (!week.find(w => w.key === selectedDayKey)) selectedDayKey = week[0].key;

  { rawCategory:'Polievka', name:'Slepačí vývar s rezancami (0.33l)', price:0.80 },
  { rawCategory:'Menu 1', name:'Vyprážaný kurací rezeň, zemiakové pyré (150g)', price:2.60 },

function parseMenuText(raw){
  const priceRe = /(\d+[.,]\d{2})\s*€?/;
  const lines = String(raw).split(/\r?\n/).map(l => l.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').trim()).filter(Boolean);
  const items = [];
  let currentCategory = 'Iné';
  lines.forEach(line => {
    const hasPrice = priceRe.test(line);
    const catMatch = CATEGORY_MAP.find(c => c.re.test(line));
    if (catMatch && !hasPrice) {
      currentCategory = catMatch.key === 'catSoup' ? 'Polievka'
        : catMatch.key === 'catMenu1' ? 'Menu 1'
        : catMatch.key === 'catMenu2' ? 'Menu 2'
        : catMatch.key === 'catSalad' ? 'Šalát'
        : line;
      return;
    }
    if (!hasPrice) return;
    const m = line.match(priceRe);
    if (!m) return;
    const price = parseFloat(m[1].replace(',', '.'));
    let name = line.replace(priceRe, '').replace(/€/g, '').trim().replace(/[-–:]+$/, '').trim();
    if (catMatch) {
      currentCategory = catMatch.key === 'catSoup' ? 'Polievka'
        : catMatch.key === 'catMenu1' ? 'Menu 1'
        : catMatch.key === 'catMenu2' ? 'Menu 2'
        : catMatch.key === 'catSalad' ? 'Šalát'
        : currentCategory;
    }
    if (name && !isNaN(price)) items.push({ rawCategory: currentCategory, name, price });
  });
  return items;
}

/* GitHub Pages auto-fetch: reads data/menu.json from the same repo */
async function tryAutoFetchMenu(dayKey){
  try {
    const res = await fetch('data/menu.json', { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.date === dayKey && Array.isArray(data.items) && data.items.length) {
      await Storage.set(`menu:${dayKey}`, { items: data.items, updatedAt: Date.now(), auto: true });
      return data.items;
    }
  } catch (e) { console.warn('Auto-fetch from repo failed', e); }
  return null;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDaySelector(){
  const el = document.getElementById('day-selector');
  el.innerHTML = '';
  week.forEach(w => {
    const active = w.key === selectedDayKey;
    const label = new Intl.DateTimeFormat(LOCALE_TAG[lang] || 'en-GB', { weekday:'short', day:'2-digit', month:'2-digit' }).format(w.date);
    const btn = document.createElement('button');
    btn.className = 'chip' + (active ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { selectedDayKey = w.key; renderDaySelector(); loadAndRenderMenu(); };
    el.appendChild(btn);
  });
}

async function loadAndRenderMenu(){
  const listEl = document.getElementById('menu-list');
  const statusEl = document.getElementById('menu-status');
  document.getElementById('official-link').href = officialUrlFor(selectedDayKey);

  listEl.innerHTML = `<div class="skeleton"><div class="menu-item" style="height:3.5rem"></div><div class="menu-item" style="height:3.5rem"></div></div>`;

  let saved = null;
  try { saved = await Storage.get(`menu:${selectedDayKey}`); } catch (e) {}

  let items = null;
  if (saved && saved.items && saved.items.length) {
    items = saved.items;
    statusEl.textContent = (saved.auto ? 'Auto-fetched: ' : t('updatedManual')) + new Date(saved.updatedAt).toLocaleString(LOCALE_TAG[lang] || 'en-GB');
  } else {
    items = await tryAutoFetchMenu(selectedDayKey);
    if (items) {
      statusEl.textContent = 'Auto-fetched: ' + new Date().toLocaleString(LOCALE_TAG[lang] || 'en-GB');
    }
  }

  const isToday = selectedDayKey === fmtKey(new Date());
  if (!items) items = isToday ? DEMO_MENU : null;

  if (!items || !items.length) {
    listEl.innerHTML = `<div class="empty-box"><strong>${t('noMenuTitle')}</strong><br>${t('noMenuDesc')}</div>`;
    statusEl.textContent = '';
    return;
  }

  if (!statusEl.textContent) statusEl.textContent = t('demoTag');

  listEl.innerHTML = items.map(item => {
    const style = categoryStyle(item.rawCategory);
    return `
      <div class="menu-item">
        <div style="min-width:0">
          <span class="cat-badge ${style.cls}">${escapeHtml(t(style.key))}</span>
          <div style="margin-top:.3rem;font-weight:500">${escapeHtml(item.name)}</div>
        </div>
        <div class="price">${item.price != null ? item.price.toFixed(2) + ' €' : '—'}</div>
      </div>`;
  }).join('');
}

          <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
            <strong>${escapeHtml(spot.name)}</strong>
            <span class="discount-tag">${escapeHtml(typeof spot.phrase === 'string' && !spot.phrase.startsWith('discount') && !spot.phrase.startsWith('subsidy') && !spot.phrase.startsWith('library') && !spot.phrase.startsWith('pool') && !spot.phrase.startsWith('cinema') ? spot.phrase : t(spot.phrase))}</span>
          </div>
          <p class="muted" style="margin:.25rem 0 0">📍 ${escapeHtml(addr)}</p>
          <div class="nav-btns">
            ${navLinks(spot.lat, spot.lng)}
            ${spot.url ? `<a class="nav-btn" href="${escapeHtml(spot.url)}" target="_blank" rel="noopener">🔗 ISIC</a>` : ''}
          </div>
        </div>
        <button class="fav-btn${isFav ? ' active' : ''}" data-fav-id="${spot.id}" aria-label="favorite">${isFav ? '★' : '☆'}</button>
      </div>`;
  }).join('');

  listEl.querySelectorAll('[data-fav-id]').forEach(btn => {
    btn.onclick = () => toggleFavorite(btn.dataset.favId);
  });
}

async function toggleFavorite(id){
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  await Storage.set('discount-favorites', favorites);
  renderDiscounts();
}

document.getElementById('discount-search').addEventListener('input', renderDiscounts);

function initMap(){
  if (map) return;
  try {
    if (typeof L === 'undefined') throw new Error('Leaflet failed to load');
    map = L.map('map').setView([48.7250, 21.2530], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
    mapReady = true;
  } catch (e) {
    console.warn('Map unavailable:', e);
    document.getElementById('map').style.display = 'none';
    document.getElementById('map-fallback').style.display = 'block';
    document.getElementById('map-fallback').textContent = t('mapFallback');
  }
  renderDiscounts();
}

function renderSubsidyCalc(){
  const totalEl = document.getElementById('calc-total');
  const mealsEl = document.getElementById('calc-meals');
  const resultBox = document.getElementById('calc-result');
  const subsidyEl = document.getElementById('calc-subsidy');
  const finalEl = document.getElementById('calc-final');

  function calc(){
    const total = parseFloat(totalEl.value) || 0;
    const meals = parseInt(mealsEl.value) || 1;
    let subsidy = 0;
    if (total > 7.99 && meals >= 2) subsidy = 4.00;
    else if (total > 3.99) subsidy = 2.00;

    if (total <= 0) { resultBox.style.display = 'none'; return; }
    resultBox.style.display = 'block';
    subsidyEl.textContent = subsidy.toFixed(2) + ' €';
    if (subsidy > 0) {
      finalEl.textContent = t('calcResult') + ' ' + (total - subsidy).toFixed(2) + ' €';
    } else {
      finalEl.textContent = t('calcNoSubsidy');
    }
  }
  totalEl.oninput = calc;
  mealsEl.oninput = calc;
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang, true));
});

async function init(){
  let stored = null;
  try { stored = await Storage.get('lang'); } catch (e) {}
  lang = stored || detectLang();
  applyStaticTranslations();

  renderDaySelector();
  await loadAndRenderMenu();
  await loadDiscountsFromRepo();
  renderCategoryFilter();
  renderDiscounts();
  renderSubsidyCalc();
  renderDPMK();

  try { favorites = (await Storage.get('discount-favorites')) || []; } catch (e) { favorites = []; }

  updateClockAndStatus();
  setInterval(updateClockAndStatus, 30000);

  setTimeout(initMap, 50);
}

init();
</script>
