name: Update ISIC Discounts

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-discounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch ISIC discounts
        run: node scripts/fetch-discounts.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/discounts.json
          git diff --cached --quiet || git commit -m "auto: update ISIC discounts $(date -u +%Y-%m-%d)"
          git push
